<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <title>پرداخت ناموفق | NOQTEH</title>
  <link rel="stylesheet" href="css/style.css">

    .payment-result h1 { font-size: 32px; margin-bottom: 16px; color: #c0392b; }

    .payment-result .btn { display: inline-block; }
  </style>
</head>
<body>
  <main class="payment-result">
    <div class="box">
      <h1>پرداخت ناموفق بود</h1>
      <p>متأسفانه تراکنش شما تکمیل نشد. می‌توانید دوباره تلاش کنید یا با پشتیبانی تماس بگیرید.</p>
      <a href="cart.html" class="btn">بازگشت به سبد خرید</a>
      <a href="index.html" class="btn btn-secondary">صفحه اصلی</a>
    </div>
  </main>
</body>
</html>
